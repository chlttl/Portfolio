    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="rank-num">${item.rank}</td>
          <td style="font-weight: 700; color: #ffffff;">
            ${item.name}
            <span class="publisher-sub">${item.publisher}</span>
          </td>
          <td><span class="progress-badge">${item.progress}</span></td>
          <td><span class="genre-tag">${item.genre}</span></td>
          <td style="color: #cbd5e1; font-size: 0.9rem; line-height: 1.6;">${item.review}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = gameData.filter(g => 
        g.name.toLowerCase().includes(query) || 
        g.publisher.toLowerCase().includes(query) ||
        g.genre.toLowerCase().includes(query) ||
        g.review.toLowerCase().includes(query)
      );
      renderTable(filtered);
    }

    renderTable(gameData);
